<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>공주님 옷갈아입히기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 카테고리 바 (Row 1) -->
    <nav id="catBar" class="cat-bar"></nav>

    <!-- 아이템 바 (Row 2) -->
    <div id="itemBar" class="item-bar"></div>

    <!-- 캐릭터 무대 -->
    <div class="stage-wrap">
      <div id="stage" class="stage">
        <img id="bodyImg" class="body-img" alt="character" draggable="false" />
        <div id="layers" class="layers"></div>
      </div>

      <div class="stage-actions">
        <button id="btnRandom" class="btn">🎲 랜덤</button>
        <button id="btnReset"  class="btn">🔄 초기화</button>
        <button id="btnSave"   class="btn btn-primary">💾 저장</button>
      </div>
    </div>
  </div>

  <script src="assets.js"></script>
  <script src="game.js"></script>
</body>
</html>
